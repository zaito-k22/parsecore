name: parsecore-test

services:
  test-db:
    image: postgres:17
    container_name: parsecore-test-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: parsecore_test
      POSTGRES_USER: parsecore_test
      POSTGRES_PASSWORD: "${TEST_DB_PASSWORD:?TEST_DB_PASSWORD is required}"
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - parsecore_test_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U parsecore_test -d parsecore_test"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - test

volumes:
  parsecore_test_pgdata:
    name: parsecore_test_pgdata

networks:
  test:
    driver: bridge
